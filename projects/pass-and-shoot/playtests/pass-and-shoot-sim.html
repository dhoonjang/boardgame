<title>패스 앤 슛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Oswald:wght@500;600&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--board:#1f2a24;--panel:#2a3a30;--chalk:#e9e4d4;--paper:#f3efe4;--ink:#1d2420;--slate:#262b31;--slate-ink:#ece6d6;--muted:#a9a397;--ribbon:#f7e6a6;--ribbon-ink:#4a3c05;--accent:#e9b62f;--line:rgba(233,228,212,.2)}

.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 60px}

button:hover{background:rgba(233,228,212,.18)}button:focus-visible{outline:2px solid var(--accent)}
button.primary{background:var(--accent);color:var(--ribbon-ink);border-color:transparent;font-weight:700}
button.primary:hover{background:#f2c74a}button:disabled{opacity:.4;cursor:not-allowed}
button.small{font-size:12px;padding:4px 9px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}

.card .tag{position:absolute;top:-8px;right:8px;background:var(--accent);color:var(--ribbon-ink);font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.08em;padding:1px 7px;border-radius:10px;font-weight:600}
.card.back{background:repeating-linear-gradient(45deg,#3b4a41 0 6px,#334139 6px 12px);color:var(--chalk);align-items:center;justify-content:center;min-height:90px}

.board{background:#17211b;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}

.zrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zgroup{display:flex;flex-direction:column;gap:4px}.zgroup .gl{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.minis.h3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mini-wrap{display:flex;flex-direction:column;gap:3px}

.pitchwrap{display:flex;flex-direction:column;gap:6px}

.trackbox .tc{height:26px;font-size:11px}

</style>

<script>
// 패스 앤 슛 v5 판정 엔진. 평가기(deck-v5-eval.js)와 웹 게임(play.html)이 같이 쓴다.
// 규칙: D-12(위치 트랙·다섯 결과·맞대기 −d/+a), D-14(마커 1~19 겹침 없음), D-16(혼선 없음, 기본 4/8/12/16), D-17(시스템+플레이), D-18(카드 고유 효과와 단계 순서).
(function(root,factory){if(typeof module!=='undefined'&&module.exports)module.exports=factory();else root.ENGINE=factory();})(this,function(){
const TR=['템포','폭','공간','조직'];
const AT=[['점유','전환'],['측면','중앙'],['뒷공간','발밑'],['패턴','개인']];
const DT=[['점유 저지','전환 저지'],['측면 저지','중앙 저지'],['뒷공간 저지','발밑 저지'],['패턴 저지','개인 저지']];
const BLK_KO={'점유 저지':'압박','전환 저지':'내려서기','측면 저지':'측면 봉쇄','중앙 저지':'중앙 밀집','뒷공간 저지':'딥 라인','발밑 저지':'하이 라인','패턴 저지':'대인','개인 저지':'지역 커버'};
const tIdxA={},tIdxD={};AT.forEach((p,t)=>p.forEach((n,k)=>tIdxA[n]=[t,k]));DT.forEach((p,t)=>p.forEach((n,k)=>tIdxD[n]=[t,k]));
const BANDS=['카운터','소유 상실','교착','전진','돌파'];
const BOUND=[0,3,1,2],PAIRS=[[0,1],[1,2],[2,3],[3,0]],MK=['①','②','③','④'];
const P={MINSTR:2,BASE:[4,8,12,16],VSCALE:1};

// ---- 카드 고유 효과 (D-18). 단계: icon → trait → marker → remap → move → arrive. 같은 단계에서는 수비(시스템→플레이) 먼저, 공격(시스템→플레이) 나중.
// pos 는 공격자 기준 공 위치. 수비 카드의 pos 조건도 공격자 기준으로 적는다.
const EFFECTS={
 // 공격 시스템
 A01:{text:'자기 진영(−2·−1)에서 교착은 전진으로 본다',fx:[{ph:'remap',from:2,to:3,pos:[-2,-1]}]},
 A02:{text:'상대 압박 아이콘 1개를 지운다',fx:[{ph:'icon',remove:'점유 저지'}]},
 A03:{text:'자기 진영(−2·−1)에서 전진·돌파가 +1 더 간다',fx:[{ph:'move',band:[3,4],extra:1,pos:[-2,-1]}]},
 A04:{text:'폭에서 이기면(+) 마커 ④ 를 1칸 왼쪽',fx:[{ph:'marker',m:3,shift:-1,trait:1}]},
 A07:{text:'마커 ① 을 1 로 (카운터는 눈 1 뿐)',fx:[{ph:'marker',m:0,set:1}]},
 A13:{text:'상대 진영(1·2)에서 돌파는 +3',fx:[{ph:'move',band:[4],extra:1,pos:[1,2]}]},
 A19:{text:'내 플레이 카드의 전환 아이콘 +1',fx:[{ph:'icon',addOwn:'전환',on:'P'}]},
 A20:{text:'상대 대인 아이콘 1개를 지운다',fx:[{ph:'icon',remove:'패턴 저지'}]},
 // 공격 플레이
 A05:{text:'상대 측면 봉쇄 아이콘 1개를 지운다',fx:[{ph:'icon',remove:'측면 저지'}]},
 A06:{text:'위치 1 이상에서 전진도 골',fx:[{ph:'arrive',goalOnBand:3,pos:[1,2]}]},
 A08:{text:'폭에서 이기면(+) 전진은 돌파로 본다',fx:[{ph:'remap',from:3,to:4,trait:1}]},
 A09:{text:'위치 0 에서 전진은 +2',fx:[{ph:'move',band:[3],extra:1,pos:[0]}]},
 A10:{text:'위치 2 에서 교착은 전진으로 본다 (골)',fx:[{ph:'remap',from:2,to:3,pos:[2]}]},
 A11:{text:'위치 0·1 에서 교착은 전진으로 본다',fx:[{ph:'remap',from:2,to:3,pos:[0,1]}]},
 A12:{text:'공간에서 이기면(+) 돌파는 +3',fx:[{ph:'move',band:[4],extra:1,trait:2}]},
 A14:{text:'소유 상실은 교착으로 본다',fx:[{ph:'remap',from:1,to:2}]},
 A15:{text:'카운터는 소유 상실로 본다',fx:[{ph:'remap',from:0,to:1}]},
 A16:{text:'위치 −1·0 에서 전진·돌파가 +1 더 간다',fx:[{ph:'move',band:[3,4],extra:1,pos:[-1,0]}]},
 A17:{text:'돌파는 +3',fx:[{ph:'move',band:[4],extra:1}]},
 A18:{text:'상대 지역 커버 아이콘 1개를 지운다',fx:[{ph:'icon',remove:'개인 저지'}]},
 // 수비 시스템
 D01:{text:'공격자가 자기 진영(−2·−1)에 있으면 소유 상실은 카운터로 본다',fx:[{ph:'remap',from:1,to:0,pos:[-2,-1]}]},
 D02:{text:'위치 0 에서 상대 전진은 교착으로 본다',fx:[{ph:'remap',from:3,to:2,pos:[0]}]},
 D03:{text:'위치 1 에서 상대 돌파는 전진으로 본다',fx:[{ph:'remap',from:4,to:3,pos:[1]}]},
 D06:{text:'상대 전진의 추가 이동(+)을 무효로',fx:[{ph:'move',cancelExtra:[3]}]},
 D07:{text:'상대 돌파의 추가 이동(+)을 무효로',fx:[{ph:'move',cancelExtra:[4]}]},
 D09:{text:'상대 돌파는 +3 이 된다. 대신 마커 ④ 를 1칸 오른쪽',fx:[{ph:'marker',m:3,shift:1},{ph:'move',band:[4],extra:1,forOpp:true}]},
 D13:{text:'상대 폭 결과가 + 면 1 줄인다',fx:[{ph:'trait',t:1,ifPositive:true,delta:-1}]},
 D14:{text:'위치 0 에서 상대 돌파는 전진으로 본다',fx:[{ph:'remap',from:4,to:3,pos:[0]}]},
 // 수비 플레이
 D04:{text:'위치 1 에서 상대 전진은 교착으로 본다',fx:[{ph:'remap',from:3,to:2,pos:[1]}]},
 D05:{text:'대인으로 잡으면 1 더 세게 (−d−1)',fx:[{ph:'trait',t:3,ifHitSide:0,delta:-1}]},
 D08:{text:'소유 상실은 카운터로 본다',fx:[{ph:'remap',from:1,to:0}]},
 D10:{text:'상대가 전진·돌파로 위치 2 에 도착하면 오프사이드: 소유 상실',fx:[{ph:'arrive',offside:true}]},
 D11:{text:'상대 뒷공간 아이콘 1개를 지운다',fx:[{ph:'icon',remove:'뒷공간'}]},
 D12:{text:'위치 2 에서 상대 전진은 교착으로 본다',fx:[{ph:'remap',from:3,to:2,pos:[2]}]},
 D15:{text:'측면 봉쇄로 잡으면 1 더 세게 (−d−1)',fx:[{ph:'trait',t:1,ifHitSide:0,delta:-1}]},
 D16:{text:'카운터면 상대 위치 +2',fx:[{ph:'move',counterExtra:1}]},
 D17:{text:'마커 ④ 를 19 로 (돌파는 눈 20 뿐)',fx:[{ph:'marker',m:3,set:19}]},
 D18:{text:'카운터면 상대 위치 +3',fx:[{ph:'move',counterExtra:2}]},
 D19:{text:'골이 나면 위치 2 에서 교착 (선방)',fx:[{ph:'arrive',save:true}]},
 D20:{text:'위치 2 에서 상대 교착은 소유 상실로 본다',fx:[{ph:'remap',from:2,to:1,pos:[2]}]},
};
function effectText(id){return EFFECTS[id]?EFFECTS[id].text:'';}

// ---- 한 라운드. A=[시스템,플레이] 공격 카드, D=[시스템,플레이] 수비 카드 (플레이는 null 가능 = 빈 플레이). opts:{swapA,swapD}
// 반환: {vs, why, B, mlog, eff, outcome(band,pos) → {kind, swap, np, goal, concede, notes}}
function evalRound(A,D,opts){opts=opts||{};
 const active=(cards,side)=>cards.map(c=>c?{c,side,type:c.type,fx:(EFFECTS[c.id]?EFFECTS[c.id].fx:[])}:null);
 const aE=active(A,'A'),dE=active(D,'D');const notes0=[];
 const fxOf=(list,ph)=>{const out=[];for(const e of list){if(!e)continue;for(const f of e.fx)if(f.ph===ph)out.push({...f,card:e.c,side:e.side});}return out;};
 // 1. 아이콘: 상대 아이콘 지우기, 내 플레이 아이콘 더하기
 const cnt=(cards,tIdx)=>{const c=[[0,0],[0,0],[0,0],[0,0]];for(const x of cards){if(!x)continue;for(const [n,v] of Object.entries(x.icons)){const [t,k]=tIdx[n];c[t][k]+=v;}}return c;};
 const ca=cnt(A,tIdxA),cd=cnt(D,tIdxD);const icNotes=[];
 for(const f of fxOf(aE,'icon')){if(f.remove){const [t,k]=tIdxD[f.remove];if(cd[t][k]>0){cd[t][k]--;icNotes.push(f.card.name+': 상대 '+BLK_KO[f.remove]+' −1');}}
  if(f.addOwn&&A[1]){const [t,k]=tIdxA[f.addOwn];ca[t][k]++;icNotes.push(f.card.name+': 플레이 '+f.addOwn+' +1');}}
 for(const f of fxOf(dE,'icon')){if(f.remove){const [t,k]=tIdxA[f.remove];if(ca[t][k]>0){ca[t][k]--;icNotes.push(f.card.name+': 상대 '+f.remove+' −1');}}}
 const prof=c=>c.map(([x,y])=>{const st=Math.abs(x-y);const side=st>=P.MINSTR?(x>y?0:1):-1;return {side,str:side<0?0:st,x,y};});
 const pa=prof(ca),pd=prof(cd);

const RULES='<h2>규칙 요약</h2><ol style="font-size:13px;line-height:1.6;padding-left:20px"><li><b>배분</b>: 시스템은 뒷면으로 4장씩(공격·수비). 플레이는 공격 12장·수비 12장을 각각 공용 덱으로 섞고 3장씩 뽑아 손에 든다.</li><li><b>손패</b>: 낸 플레이는 버린 더미로 가고, 판정 뒤 공격자는 공격 플레이 1장, 수비자는 수비 플레이 1장을 뽑는다(손패 3장 유지). 덱이 떨어지면 버린 더미를 섞어 쓴다. 라운드 사이에 손패 1장을 버리고 1장 뽑는 교체 뽑기는 하프당 2회.</li><li><b>라운드</b>: 수비자 시스템 유지/교체(공개) → 공격자 시스템(공개) → 두 시스템을 본 뒤 각자 플레이 1장을 뒷면으로 내고 동시에 공개 → 판정. 이 앱은 혼자 시뮬레이션하는 용도라 한 화면에서 넷을 다 고른다. 시스템을 바꾼 라운드에는 자기 마커가 1칸 불리(공격 ① +1 / 수비 ④ −1).</li><li><b>판정</b>: 특성(색)마다 아이콘을 더하고 반대 성향은 1:1 로 지운다(2 미만이면 없음). 상대 방패가 내 성향을 노리거나 내가 없으면 −d, 아니면 +a. 마커 ① 템포+공간 · ② 템포+조직 · ③ 조직+폭 · ④ 폭+공간, 1점 = 1칸, 많이 움직이는 마커부터, 겹치지 않는다(1~19). d20: ① 이하 카운터 / ② 소유 상실 / ③ 교착 / ④ 전진 / 그 위 돌파.</li><li><b>카드 효과</b>: 카드마다 고유한 효과가 한 줄 있다. 단계 순서로 적용한다: 아이콘 → 맞대기 → 마커 → 결과 바꾸기 → 이동량 → 도착. 같은 단계에서는 수비(시스템→플레이) 먼저, 공격(시스템→플레이) 나중. 시스템의 효과는 서 있는 동안 계속 산다.</li><li><b>공 위치</b> −2~2: 카운터는 교대·상대 기준 +1(내가 −2 면 실점), 소유 상실은 교대, 교착은 그대로, 전진 +1, 돌파 +2. 2 를 넘으면 골, 실점 팀이 0 에서 킥오프(시스템 다시 세움).</li><li><b>경기</b>: 전·후반 9 라운드. 하프타임에 플레이 덱을 다시 섞고 3장씩 새로 뽑는다. 후반 킥오프는 반대 팀.</li></ol>';

function startNew(){const n0=document.getElementById('n0').value.trim()||'홈',n1=document.getElementById('n1').value.trim()||'원정';const r=Math.max(1,Math.min(30,parseInt(document.getElementById('rounds').value,10)||9));newGame([n0,n1],r);render();}
let sel={};
// ---- 경기장 (위에서 본 그림). 절대 좌표: 왼쪽이 홈(0) 골문, 오른쪽이 원정(1) 골문. 공격자 기준 pos 를 절대 구역(0~4)으로
function absZone(){return G.att===0?G.pos+2:2-G.pos;}
function pitchSVG(){const z=absZone();const bx=100+z*200;
 let zones='';for(let k=0;k<5;k++)zones+='<rect x="'+(k*200)+'" y="0" width="200" height="400" fill="'+(k%2?'#2f7a44':'#2b7040')+'"/>';
 const lines='<rect x="8" y="8" width="984" height="384" fill="none" stroke="#dfe8dc" stroke-width="3"/><line x1="500" y1="8" x2="500" y2="392" stroke="#dfe8dc" stroke-width="3"/><circle cx="500" cy="200" r="60" fill="none" stroke="#dfe8dc" stroke-width="3"/><circle cx="500" cy="200" r="4" fill="#dfe8dc"/>'
  +'<rect x="8" y="90" width="150" height="220" fill="none" stroke="#dfe8dc" stroke-width="3"/><rect x="8" y="150" width="55" height="100" fill="none" stroke="#dfe8dc" stroke-width="3"/><rect x="842" y="90" width="150" height="220" fill="none" stroke="#dfe8dc" stroke-width="3"/><rect x="937" y="150" width="55" height="100" fill="none" stroke="#dfe8dc" stroke-width="3"/>'
  +'<rect x="0" y="165" width="8" height="70" fill="#f3efe4"/><rect x="992" y="165" width="8" height="70" fill="#f3efe4"/>';
 const arrow=G.att===0?'<path d="M560 355 L640 355 L640 343 L665 360 L640 377 L640 365 L560 365 Z" fill="rgba(243,239,228,.55)"/>':'<path d="M440 355 L360 355 L360 343 L335 360 L360 377 L360 365 L440 365 Z" fill="rgba(243,239,228,.55)"/>';
 const ball='<circle cx="'+bx+'" cy="200" r="22" fill="#f7f3e8" stroke="#1d2420" stroke-width="3"/><path d="M'+(bx-8)+' 190 l8 -6 l8 6 l-3 9 l-10 0 z" fill="#1d2420"/>';
 const glow='<rect x="'+(z*200)+'" y="0" width="200" height="400" fill="rgba(233,182,47,.16)"/>';
 return '<svg class="pitch" viewBox="0 0 1000 400" role="img" aria-label="경기장">'+zones+glow+lines+arrow+ball+'</svg>';}
function zoneLabels(){const names=['홈 PA','홈 진영','중원','원정 진영','원정 PA'];const z=absZone();return '<div class="zonelabels">'+names.map((n,k)=>'<div'+(k===z?' style="color:var(--chalk);font-weight:600"':'')+'>'+n+'</div>').join('')+'</div>';}
function scoreBar(){return '<div class="scorebar"><span>'+h(G.names[0])+'</span><b>'+G.score[0]+'</b><span class="rd">'+(G.half===1?'전반':'후반')+' '+G.round+'/'+G.rounds+'</span><b>'+G.score[1]+'</b><span>'+h(G.names[1])+'</span></div>';}
// ---- 플레이어 구역 (원정 위, 홈 아래)
function chooseStep(){if(!sel.defSys)return 1;if(!sel.attSys)return 2;return 3;}
function playerZone(i,choosing){const p=P(i);const isAtt=G.att===i;const role=isAtt?'공격':'수비';const step=choosing?chooseStep():0;
 const mini=(id,pickable,selKey)=>{const c=CARD[id];const stand=(c.side==='A'?p.standA:p.standD)===id;return '<div class="mini-wrap">'+cardHTML(c,{mini:true,pick:pickable,sel:pickable&&sel[selKey]===id,tag:stand?'세워 둠':'',dim:!pickable&&choosing})+((choosing&&c.type==='P'&&p.redrawLeft>0&&!p.redrewThisRound)?'<button class="small" data-redraw="'+id+'" data-player="'+i+'">버리고 뽑기</button>':'')+'</div>';};
 const sysA=p.attSys.map(id=>mini(id,choosing&&isAtt&&step>=2,'attSys')).join(''),sysD=p.defSys.map(id=>mini(id,choosing&&!isAtt&&step>=1,'defSys')).join('');
 const handA=p.handA.map(id=>mini(id,choosing&&isAtt&&step>=3,'attPlay')).join(''),handD=p.handD.map(id=>mini(id,choosing&&!isAtt&&step>=3,'defPlay')).join('');
 return '<div class="zone '+(i===1?'away':'home')+'"><div class="zh"><span><b>'+h(G.names[i])+'</b> · 이번 라운드 '+role+'</span><span>교체 뽑기 남은 '+p.redrawLeft+'회'+(p.redrewThisRound?' (사용함)':'')+'</span></div>'
  +'<div class="zrow"><div class="zgroup"><div class="gl">공격 시스템</div><div class="minis">'+sysA+'</div></div><div class="zgroup"><div class="gl">수비 시스템</div><div class="minis">'+sysD+'</div></div></div>'
  +'<div class="zrow" style="margin-top:6px"><div class="zgroup"><div class="gl">공격 플레이 손패</div><div class="minis h3">'+(handA||'<div class="note">비어 있음</div>')+'</div></div><div class="zgroup"><div class="gl">수비 플레이 손패</div><div class="minis h3">'+(handD||'<div class="note">비어 있음</div>')+'</div></div></div></div>';}
// ---- 가운데 슬롯: 공격 편(공격자 쪽)과 수비 편
function slotCol(i,choosing){const isAtt=G.att===i;const p=P(i);
 const sysId=isAtt?(choosing?sel.attSys:p.standA):(choosing?sel.defSys:p.standD);const playId=isAtt?(choosing?sel.attPlay:G.pending.attPlay):(choosing?sel.defPlay:G.pending.defPlay);
 const box=(id,label,empty,key)=>'<div><div class="sl">'+label+'</div>'+(id?'<div class="slotbox filled" data-clear="'+key+'">'+cardHTML(CARD[id],{slot:true,pick:choosing})+'</div>':'<div class="slotbox">'+empty+'</div>')+'</div>';
 const step=choosing?chooseStep():0;
 const roleLabel=(isAtt?'공격':'수비')+' · '+h(G.names[i]);
 const sysEmpty=isAtt?(step>=2?'② 공격 시스템을 고르세요':'수비 시스템 다음에'):'① 수비 시스템을 고르세요';const playEmpty=step>=3?((isAtt?'공격':'수비')+' 플레이를 손패에서 고르세요'+((isAtt?p.handA:p.handD).length?'':' (없음 → 빈 플레이)')):'시스템 다음에';
 return '<div class="slotcol">'+box(sysId,roleLabel+' 시스템',sysEmpty,isAtt?'attSys':'defSys')+box(playId,roleLabel+' 플레이',playEmpty,isAtt?'attPlay':'defPlay')+'</div>';}
function renderBoard(){const choosing=G.phase==='choose';const a=G.att,d=1-a,pa=P(a),pd=P(d);
 if(choosing){if(!pd.defSys.includes(sel.defSys))sel.defSys=null;if(!pa.attSys.includes(sel.attSys))sel.attSys=null;
  if(!sel.attPlay||!pa.handA.includes(sel.attPlay))sel.attPlay=null;if(!sel.defPlay||!pd.handD.includes(sel.defPlay))sel.defPlay=null;}
 const step=choosing?chooseStep():0;
 const ready=choosing&&sel.defSys&&sel.attSys&&(sel.attPlay||!pa.handA.length)&&(sel.defPlay||!pd.handD.length);
 let R=null,b0=null,o=null;if(!choosing){R=currentJudge().R;if(G.roll){b0=band(G.roll,R.B);o=R.outcome(b0,G.pos);}}
 // 액션 영역
 let actions='';
 if(choosing){const st=(n,txt)=>'<span style="'+(step===n?'color:var(--accent);font-weight:700':'color:var(--muted)')+'">'+txt+'</span>';
  const guide=step===1?'세워 둔 것을 그대로 쓰려면 그 카드를 누르세요':step===2?'수비 시스템을 보고 공격 시스템을 세우세요':'두 시스템을 보고 플레이를 고르면 동시에 뒤집습니다';
  actions='<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:13px">'+st(1,'① '+h(G.names[d])+' 수비 시스템')+' → '+st(2,'② '+h(G.names[a])+' 공격 시스템')+' → '+st(3,'③ 두 플레이')+'</div><div class="note">'+guide+'</div></div><button class="primary" id="confirm" '+(ready?'':'disabled')+'>판정하기</button>';}
 else if(G.roll==null)actions='<span class="note">마커가 움직였습니다.</span><button class="primary" onclick="rollDice()">d20 굴리기</button>';
 else{let s;if(o.kind==='goal')s='골!';else if(o.kind==='concede')s='역습 실점!';else if(o.kind==='saved')s='골이지만 선방. 위치 2 교착';else if(o.kind==='swap')s='공격권 교대. '+h(G.names[d])+' 이(가) 위치 '+o.np+' 에서 공격';else s='위치 '+o.np;
  actions='<div class="dice">'+G.roll+'</div><div class="bigres">'+BANDS[b0]+' — '+s+'</div>'+(o.notes.length?'<div class="note">'+o.notes.join(' · ')+'</div>':'')+'<button class="primary" onclick="applyRound()">다음 라운드</button>';}
 // 판정 트랙
 let track='';{const B=R?R.B:BASE;let cells='';for(let r=1;r<=20;r++){const b=band(r,B);cells+='<div class="tc'+(G.roll===r?' hit':'')+'" style="background:'+BC[b]+'">'+r+'</div>';}
  let marks='';for(let i=0;i<4;i++)marks+='<div class="mk" style="left:'+(B[i]/20*100)+'%">'+MK[i]+'<small>'+B[i]+'</small></div>';
  const cnt=[0,0,0,0,0];for(let r=1;r<=20;r++)cnt[band(r,B)]++;
  track='<div class="trackbox"><div class="sl" style="font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">판정 트랙 '+(R?'(이동 후)':'(기본 4/8/12/16)')+'</div><div class="track">'+cells+'</div><div class="marks">'+marks+'</div><div class="legend">'+BANDS.map((n,i)=>'<span><i style="background:'+BC[i]+'"></i>'+n+' '+(cnt[i]*5)+'%</span>').join('')+'</div></div>';}
 let html=topbar(choosing?'<button class="small" onclick="autoChoice()">무작위 채우기</button>':'');
 html+='<div class="board">'+playerZone(1,choosing)
  +'<div class="center">'+slotCol(1,choosing)
  +'<div class="pitchwrap">'+scoreBar()+pitchSVG()+zoneLabels()+'<div class="actions">'+actions+'</div>'+track+'</div>'
  +slotCol(0,choosing)+'</div>'
  +playerZone(0,choosing)+'</div>';
 // 판정 설명 (판정 뒤)
 if(R){html+='<div class="panel"><h3>맞대기 (공격 기준)</h3>'+(R.notes.length?'<div class="note">효과: '+R.notes.join(' · ')+'</div>':'')+'<div class="why">'+R.why.map(w=>'<b style="color:'+COL[w.t]+'">'+TR[w.t]+'</b><span>'+w.an+' vs '+w.dn+' → '+w.txt+'</span>').join('')+'</div>'
  +'<h3>마커 이동 (① 템포+공간 · ② 템포+조직 · ③ 조직+폭 · ④ 폭+공간, 많이 움직이는 순)</h3><div class="note">'+R.mlog.join(' &nbsp;·&nbsp; ')+(R.eff.length?' &nbsp;·&nbsp; '+R.eff.join(' · '):'')+'</div>';
  const p=G.pos;const describe=x=>x.kind==='goal'?'골':x.kind==='concede'?'실점(역습)':x.kind==='saved'?'선방, 위치 2 교착':x.kind==='swap'?'교대, 상대 위치 '+x.np:'위치 '+x.np;
  html+='<table class="otab"><tr><th style="text-align:left;padding-right:14px">결과</th><th style="text-align:left">공 위치 '+p+' 에서</th></tr>'+BANDS.map((n,i)=>{const x=R.outcome(i,p);return '<tr><td><i style="background:'+BC[i]+'"></i>'+n+'</td><td>'+describe(x)+(x.notes.length?' ('+x.notes.join(', ')+')':'')+'</td></tr>';}).join('')+'</table></div>';}
 html+='<div class="row"><div style="flex:1;min-width:280px">'+deckPanel('A')+'</div><div style="flex:1;min-width:280px">'+deckPanel('D')+'</div></div>'+(G.log.length?'<div class="panel"><h3>기록</h3><div class="log">'+G.log.slice(-8).reverse().map(h).join('<br>')+'</div></div>':'');
 app.innerHTML=html;
 if(choosing){app.querySelectorAll('.zone .card.pick').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.id;const stp=chooseStep();
   if(pd.defSys.includes(id)){sel.defSys=id;render();return;}if(pa.attSys.includes(id)&&stp>=2){sel.attSys=id;render();return;}
   if(stp>=3){if(pa.handA.includes(id)){sel.attPlay=sel.attPlay===id?null:id;render();return;}if(pd.handD.includes(id)){sel.defPlay=sel.defPlay===id?null:id;render();}}}));
  app.querySelectorAll('.slotbox.filled').forEach(el=>el.addEventListener('click',()=>{const k=el.dataset.clear;if(k==='attPlay'||k==='defPlay'){sel[k]=null;render();}}));
  app.querySelectorAll('button[data-redraw]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.redraw,i=+el.dataset.player;if(sel.attPlay===id)sel.attPlay=null;if(sel.defPlay===id)sel.defPlay=null;redraw(i,id);}));
  const btn=document.getElementById('confirm');if(btn)btn.addEventListener('click',()=>{const s=sel;sel={};submitRound(s.defSys,s.attSys,s.attPlay,s.defPlay);});}}
function renderChoose(){renderBoard();}
function renderReveal(){renderBoard();}
function autoChoice(){const a=G.att,d=1-a,pa=P(a),pd=P(d);
 sel.defSys=(pd.standD&&Math.random()<0.7)?pd.standD:pd.defSys[rnd(4)];sel.attSys=(pa.standA&&Math.random()<0.7)?pa.standA:pa.attSys[rnd(4)];
 sel.attPlay=pa.handA.length?pa.handA[rnd(pa.handA.length)]:null;sel.defPlay=pd.handD.length?pd.handD[rnd(pd.handD.length)]:null;render();}
function renderEnd(){const w=G.score[0]===G.score[1]?'무승부':(G.score[0]>G.score[1]?G.names[0]:G.names[1])+' 승리';
 app.innerHTML=topbar()+'<div class="panel"><h2>경기 종료: '+h(w)+'</h2><div class="status"><span>'+h(G.names[0])+' <b>'+G.score[0]+'</b> : <b>'+G.score[1]+'</b> '+h(G.names[1])+'</span></div></div><div class="panel"><h3>기록</h3><div class="log" style="max-height:none">'+G.log.map(h).join('<br>')+'</div></div><div class="panel"><button class="primary" onclick="G=null;try{localStorage.removeItem(KEY)}catch(e){};render()">새 경기</button></div>';}
// ===== 자동 진행 (테스트용: ?auto=1) =====
function autoPlayAll(stopAt){newGame(['홈','원정'],9);let guard=0;
 while(G.phase!=='end'&&guard++<5000){
  if(stopAt&&G.phase===stopAt&&G.log.length>4){if(stopAt==='reveal'&&!G.roll)rollDice();render();return G;}
  if(G.phase==='choose'){const a=G.att,d=1-a,pa=P(a),pd=P(d);for(const i of [a,d]){const p=P(i);if(p.redrawLeft>0&&Math.random()<0.15){const hd=p.handA.concat(p.handD);if(hd.length)redraw(i,hd[rnd(hd.length)]);}}
   submitRound((pd.standD&&Math.random()<0.7)?pd.standD:pd.defSys[rnd(4)],(pa.standA&&Math.random()<0.7)?pa.standA:pa.attSys[rnd(4)],pa.handA.length?pa.handA[rnd(pa.handA.length)]:null,pd.handD.length?pd.handD[rnd(pd.handD.length)]:null);continue;}
  if(G.phase==='reveal'){rollDice();applyRound();continue;}}
 return G;}
try{if(location.search.includes('auto=1')){const m=location.search.match(/stop=(\w+)/);const r=autoPlayAll(m?m[1]:null);if(m){/* 화면 확인용 */}else document.body.insertAdjacentHTML('afterbegin','<pre id="autoresult">AUTO OK phase='+r.phase+' score='+r.score.join('-')+' rounds='+r.log.length+'</pre>');}else{G=null;render();}}catch(e){document.body.insertAdjacentHTML('afterbegin','<pre id="autoresult">AUTO ERROR '+h(String(e&&e.stack||e))+'</pre>');}
</script>
